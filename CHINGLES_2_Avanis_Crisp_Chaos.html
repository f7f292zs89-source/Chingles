<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffca53"><title>CHINGLES 2: AVANI'S CRISP CHAOS</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#5334a7;color:#20264c;touch-action:manipulation}#app{height:100dvh;max-width:1000px;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#72d7ff,#b4f3ff 55%,#ffcc72 56%,#ff9d67)}header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;color:#fff;text-shadow:0 2px 2px #5430a1}.brand h1{margin:0;color:#ffed69;font-size:clamp(20px,5vw,38px);line-height:1;text-shadow:2px 3px #e44748}.brand small{font-weight:1000;letter-spacing:1px;font-size:clamp(8px,2vw,12px)}.stats{display:flex;gap:4px}.stat{background:#30245e;border:2px solid #fff0a1;border-radius:9px;padding:4px 6px;text-align:center;min-width:48px}.stat span{display:block;font-size:9px;color:#ffec79;font-weight:900}.stat b{font-size:16px}#arena{position:relative;flex:1;min-height:0;border-top:3px solid #ffffffaa;border-bottom:3px solid #ffffffaa;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#hint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#30245eea;border:2px solid #fff0a1;border-radius:18px;padding:7px 12px;color:#fff;font-weight:900;font-size:clamp(10px,2.6vw,14px);pointer-events:none}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#24154d99}.panel{width:min(440px,100%);max-height:94%;overflow:auto;background:linear-gradient(145deg,#fff9cb,#ffcc69);border:4px solid white;border-radius:25px;padding:18px 16px;text-align:center;box-shadow:0 8px 0 #9c3d7d,0 18px 35px #25134c55}.panel h2{font-size:clamp(30px,8vw,52px);line-height:1;margin:0;color:#f04457;text-shadow:2px 3px white}.hero{font-size:clamp(44px,13vw,68px);margin:8px 0}.panel p{font-weight:800;line-height:1.4;margin:10px 0 15px}button{border:0;border-radius:15px;padding:12px 18px;font:inherit;font-weight:1000;cursor:pointer}.primary{width:100%;background:linear-gradient(#42db73,#12a951);color:white;font-size:20px;box-shadow:0 5px #087c3a}.note{font-size:12px;color:#68518a;font-weight:800}.hide{display:none!important}#toast{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-size:clamp(22px,6.5vw,40px);font-weight:1000;color:#fff46b;-webkit-text-stroke:1px #a73562;text-shadow:3px 4px #50296c;white-space:nowrap;pointer-events:none}
</style></head><body><div id="app"><header><div class="brand"><h1>CHINGLES 2!</h1><small>AVANI'S CRISP CHAOS</small></div><div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>COMBO</span><b id="combo">x0</b></div><div class="stat"><span>BEST</span><b id="best">0</b></div></div></header><main id="arena"><canvas id="game"></canvas><div id="toast"></div><div id="hint">☝️ DRAG TO AIM · RELEASE TO FIRE</div><div id="overlay"><div class="panel"><h2 id="title">CHINGLES 2!</h2><div class="hero" id="hero">🥔⚡👄</div><p id="message">The crisps are back! Hit the hungry mouth, build combos and grab power-ups.</p><button class="primary" id="start">LET'S CRUNCH! 🍿</button><p class="note">💛 Made for Avani · Works on phones and computers</p></div></div></main></div>
<script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),arena=document.getElementById('arena'),$=id=>document.getElementById(id);let W=800,H=500,dpr=1,playing=false,frame=0,score=0,combo=0,best=0,shots=[],particles=[],powerups=[],aim={x:600,y:150},drag=false,toastTimer=0,shake=0,rapid=0,slow=0;try{best=+(localStorage.getItem('chingles2Best')||0)}catch(e){}$('best').textContent=best;const mouth={x:0,y:0,dir:1,open:0};function resize(){const r=arena.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);mouth.y=H*.27;mouth.x=Math.max(75,Math.min(W-75,mouth.x||W*.72));aim={x:W*.72,y:H*.3};draw()}window.addEventListener('resize',resize);function rr(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function label(t,x,y,size,col='#fff',stroke='#6a348b'){ctx.font=`1000 ${size}px system-ui`;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=stroke;ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}function drawMouth(){ctx.save();ctx.translate(mouth.x,mouth.y);ctx.rotate(Math.sin(frame*.025)*.035);ctx.fillStyle='#ff9b91';ctx.beginPath();ctx.ellipse(0,0,Math.min(62,W*.16),42+mouth.open*13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#57152e';ctx.beginPath();ctx.ellipse(0,5,Math.min(47,W*.12),28+mouth.open*13,0,0,Math.PI*2);ctx.fill();rr(-37,-23,74,13,5,'#fff8e8');rr(-27,25,54,8,4,'#fff8e8');ctx.fillStyle='#ff547b';ctx.beginPath();ctx.ellipse(0,23,17,7,0,0,Math.PI*2);ctx.fill();label('•',-20,-31,13,'#57243d','#57243d');label('•',20,-31,13,'#57243d','#57243d');ctx.restore()}function drawCannon(){let x=W*.17,y=H*.8;ctx.save();ctx.translate(x,y);let a=Math.atan2(aim.y-y,aim.x-x);a=Math.max(-1.32,Math.min(-.15,a));ctx.rotate(a);rr(-5,-18,61,36,11,'#c9364a');rr(31,-22,28,44,8,'#ffd54c');ctx.fillStyle='#532a4c';ctx.beginPath();ctx.arc(55,0,10,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#e63e46';ctx.beginPath();ctx.ellipse(x-24,y+9,24,28,-.2,0,Math.PI*2);ctx.fill();label('🥔',x-23,y+18,22,'#fff','#fff')}function drawCrisp(s){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle=s.type==='mega'?'#ff9e35':s.type==='lightning'?'#f9ff63':'#ffd34e';ctx.strokeStyle='#c87926';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s.size*.7,-s.size*.35);ctx.quadraticCurveTo(-s.size*.9,-s.size*.8,0,-s.size*.55);ctx.quadraticCurveTo(s.size*.9,-s.size*.8,s.size*.7,-s.size*.35);ctx.quadraticCurveTo(s.size*.9,s.size*.25,0,s.size*.65);ctx.quadraticCurveTo(-s.size*.9,s.size*.25,-s.size*.7,-s.size*.35);ctx.fill();ctx.stroke();ctx.strokeStyle='#fff1a1';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s.size*.35,-s.size*.25);ctx.lineTo(-s.size*.05,s.size*.2);ctx.lineTo(s.size*.25,-s.size*.15);ctx.stroke();if(s.type==='lightning')label('⚡',0,5,s.size*1.3,'#fff','#d45a37');if(s.type==='mega')label('★',0,5,s.size*1.3,'#fff','#d45a37');ctx.restore()}function drawPower(p){label(p.type==='rapid'?'⚡':p.type==='mega'?'🌟':'🕒',p.x,p.y+9,28,'#fff','#6d3993');ctx.beginPath();ctx.arc(p.x,p.y,21+Math.sin(frame*.15)*3,0,Math.PI*2);ctx.strokeStyle='#fff5a5';ctx.lineWidth=3;ctx.stroke()}function burst(x,y,col){for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:25+Math.random()*20,color:col||'#ffe35c',size:3+Math.random()*5})}}function say(t){$('toast').textContent=t;toastTimer=60}function update(){frame++;mouth.x+=mouth.dir*(1.05+Math.min(score/1800,1.5))*(slow>0?.45:1);if(mouth.x>W*.9)mouth.dir=-1;if(mouth.x<W*.56)mouth.dir=1;mouth.open=Math.max(0,mouth.open-.03);if(rapid>0)rapid--;if(slow>0)slow--;if(Math.random()<.0035&&powerups.length<2)powerups.push({x:W*(.42+Math.random()*.38),y:H*(.2+Math.random()*.24),type:['rapid','mega','slow'][Math.floor(Math.random()*3)],life:500});for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.035;s.rot+=.16;s.life--;if(Math.hypot(s.x-mouth.x,s.y-mouth.y)<(s.type==='mega'?64:45)*Math.min(1.1,W/600)){let pts=s.type==='mega'?250:100;combo++;score+=pts+Math.max(0,combo-1)*10;mouth.open=1;shake=5;burst(s.x,s.y,s.type==='mega'?'#ffb72e':'#ffe35c');say(combo>=3?`CRUNCH COMBO x${combo}! +${pts}`:`CRUNCH! +${pts}`);shots.splice(i,1);$('score').textContent=score;$('combo').textContent='x'+combo;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('chingles2Best',best)}catch(e){}}continue}if(s.life<=0||s.x>W+40||s.y>H+50||s.x<-40){shots.splice(i,1);combo=0;$('combo').textContent='x0'}}for(let i=powerups.length-1;i>=0;i--){let p=powerups[i];p.life--;if(p.life<0){powerups.splice(i,1);continue}for(let j=shots.length-1;j>=0;j--){let s=shots[j];if(Math.hypot(s.x-p.x,s.y-p.y)<27){if(p.type==='rapid'){rapid=500;say('RAPID FIRE! ⚡')}if(p.type==='mega'){s.type='mega';s.size=19;s.vx*=1.12;s.vy-=1;say('MEGA CRISP! 🌟')}if(p.type==='slow'){slow=400;say('SLOW-MO MOUTH! 🕒')}burst(p.x,p.y,'#fff06b');powerups.splice(i,1);break}}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--;if(p.life<=0)particles.splice(i,1)}if(toastTimer>0)toastTimer--;if(shake>0)shake*=.8}function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5bcaff');sky.addColorStop(.57,'#b0f5ff');sky.addColorStop(.58,'#ffda85');sky.addColorStop(1,'#ff9e63');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#fff7ad':'#ff6f82';ctx.beginPath();ctx.arc((i*113+frame*.25)%W,25+(i%3)*23,3+(i%3),0,Math.PI*2);ctx.fill()}for(let i=0;i<9;i++){let x=i*W/8;ctx.strokeStyle='#fff2b4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W/16,22);ctx.stroke();ctx.fillStyle=['#ff535e','#ffdc50','#54df9b','#9e70ff'][i%4];ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W/16,22);ctx.lineTo(x+W/8,0);ctx.closePath();ctx.fill()}ctx.fillStyle='#ffb45b';ctx.fillRect(0,H*.87,W,H*.13);drawMouth();drawCannon();powerups.forEach(drawPower);shots.forEach(drawCrisp);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1});if(rapid>0)label('⚡ RAPID FIRE',W*.5,H*.12,18,'#fff66d','#69349a');ctx.restore();if(toastTimer>0)$('toast').style.opacity=Math.min(1,toastTimer/12);else $('toast').style.opacity=0}function loop(){if(playing)update();draw();requestAnimationFrame(loop)}function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function aimAt(p){aim={x:Math.max(W*.28,Math.min(W*.96,p.x)),y:Math.max(H*.1,Math.min(H*.72,p.y))}}function fire(){let sx=W*.17,sy=H*.8,dx=aim.x-sx,dy=aim.y-sy,t=Math.max(14,Math.min(36,dx/Math.max(4,W*.027))),g=.035,vx=dx/t,vy=(dy-.5*g*t*t)/t,type=rapid>0?'lightning':'normal';shots.push({x:sx+vx*5,y:sy+vy*5,vx,vy:vy+g*5,rot:0,life:140,size:rapid>0?14:11,type})}c.addEventListener('pointerdown',e=>{if(!playing)return;drag=true;aimAt(point(e));try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(playing&&drag){aimAt(point(e));draw()}});c.addEventListener('pointerup',e=>{if(!playing||!drag)return;drag=false;aimAt(point(e));if(rapid>0){fire();fire()}else fire();$('hint').textContent='☝️ DRAG TO AIM · RELEASE TO FIRE'});c.addEventListener('pointercancel',()=>drag=false);$('start').addEventListener('click',()=>{score=0;combo=0;shots=[];particles=[];powerups=[];rapid=0;slow=0;playing=true;$('score').textContent='0';$('combo').textContent='x0';$('overlay').classList.add('hide');$('hint').textContent='☝️ DRAG TO AIM · RELEASE TO FIRE';$('title').textContent='CHINGLES 2!';$('hero').textContent='🥔⚡👄';$('message').textContent='The crisps are back! Hit the hungry mouth, build combos and grab power-ups.';$('start').textContent="LET'S CRUNCH! 🍿";say('LET THE CRUNCH BEGIN!')});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){playing=false;$('title').textContent='PAUSED!';$('hero').textContent='⏸️🍿';$('message').textContent='Take a break, crunch champion! Tap below when ready.';$('start').textContent='RESUME CRUNCHING';$('overlay').classList.remove('hide');$('start').onclick=()=>{playing=true;$('overlay').classList.add('hide');$('start').textContent="LET'S CRUNCH! 🍿";$('start').onclick=null}}});resize();loop()})();</script></body></html>
