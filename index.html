<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chingles: Crisp Cannon</title><style>
:root{--yellow:#ffe65b;--red:#f04436;--blue:#168de0;--ink:#162348}*{box-sizing:border-box}body{margin:0;background:#0876c9;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none}#wrap{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:auto;background:linear-gradient(#0788e6,#7bd7ff 58%,#f8bd58)}header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;gap:8px;text-shadow:0 2px 2px #142452}h1{font-size:clamp(24px,5vw,42px);line-height:1;margin:0;color:var(--yellow);-webkit-text-stroke:1px #a42c25;text-shadow:2px 3px 0 #a42c25,0 4px 8px #183365}header small{font-weight:900;letter-spacing:2px;font-size:clamp(9px,2vw,13px)}.stats{display:flex;gap:7px}.stat{background:#142448eF;border:2px solid #ffda65;border-radius:10px;padding:5px 9px;text-align:center;min-width:67px;font-weight:900}.stat span{display:block;font-size:10px;color:#ffdf72}.stat b{font-size:18px}#stage{position:relative;flex:1;min-height:0;overflow:hidden;border-top:3px solid #ffffff88;border-bottom:3px solid #ffffff88;background:linear-gradient(#5ac8ff 0%,#87e3ff 54%,#ffcc70 55%,#eaa34b 100%)}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#17264bdd;border:2px solid #fff3a1;border-radius:18px;padding:7px 13px;font-weight:900;font-size:clamp(11px,2.5vw,16px);white-space:nowrap;text-align:center;pointer-events:none}.overlay{position:absolute;inset:0;background:#10264bc9;display:flex;align-items:center;justify-content:center;padding:16px}.panel{max-width:440px;width:100%;background:linear-gradient(145deg,#fff6bd,#ffcf62);border:5px solid #fff;border-radius:25px;color:#17234a;text-align:center;padding:20px 16px;box-shadow:0 9px 0 #a34a35,0 20px 40px #17304a77}.panel h2{font-size:clamp(34px,8vw,58px);margin:0;color:#f04436;line-height:1.05;text-shadow:2px 3px #fff;font-weight:1000}.panel p{font-weight:800;margin:10px 0 16px}.btn{border:0;border-radius:16px;padding:12px 22px;background:#20c85a;color:white;font-size:20px;font-weight:1000;box-shadow:0 5px 0 #13853b;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #13853b}.secondary{background:#7b4be7;box-shadow:0 5px 0 #4922a6;font-size:14px;margin-left:7px}.footer{padding:6px 10px;text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #17467b}.hide{display:none!important}
</style></head><body><div id="wrap"><header><div><h1>CHINGLES!</h1><small>CRISP CANNON</small></div><div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>BEST</span><b id="best">0</b></div></div></header><main id="stage"><canvas id="game"></canvas><div id="hint" class="hint">☝️ DRAG TO AIM · RELEASE TO FIRE</div><div id="overlay" class="overlay"><div class="panel"><h2>CHINGLES!</h2><div style="font-size:56px;margin:6px">🥔💥👄</div><p>LOAD THE CRISP! Aim at the hungry mouth and let it fly!</p><p>☝️ Drag anywhere to aim<br>🚀 Release to fire<br>🎯 Hit the mouth for points!</p><button id="play" class="btn">▶ PLAY</button><button id="how" class="btn secondary">HOW TO PLAY</button></div></div></main><div class="footer">ORIGINAL SNACK-THEMED ARCADE FUN · AIM CAREFULLY, CRUNCH HAPPILY!</div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),hint=document.getElementById('hint');let W=800,H=500,playing=false,drag=false,pointer={x:0,y:0},aim={x:0,y:0},shots=[],bits=[],score=0,best=+(localStorage.getItem('chinglesBest')||0),mouth={x:0,y:0,dir:1,open:0},message='',messageT=0,shotsLeft=0,frame=0;document.getElementById('best').textContent=best;
function resize(){let r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=Math.round(W*d);c.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);mouth.y=H*.28;mouth.x=Math.max(90,Math.min(W-90,mouth.x||W*.72));aim={x:W*.72,y:H*.3};draw()}window.addEventListener('resize',resize);
function roundRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function text(t,x,y,size,color,stroke='#17305c',sw=3){ctx.font=`1000 ${size}px system-ui`;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y)}
function drawTube(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(-.13);ctx.scale(s,s);ctx.fillStyle='#e93831';ctx.beginPath();ctx.roundRect(-24,-52,48,100,12);ctx.fill();ctx.fillStyle='#f6e8d1';ctx.beginPath();ctx.ellipse(0,-51,24,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b7d8e6';ctx.fillRect(-22,-55,44,7);ctx.fillStyle='#ffdc62';ctx.beginPath();ctx.ellipse(0,-8,21,26,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-9,-27,8,10,0,0,Math.PI*2);ctx.ellipse(9,-27,8,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172448';ctx.beginPath();ctx.arc(-8,-25,3.5,0,Math.PI*2);ctx.arc(10,-25,3.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4a2119';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-19,-38);ctx.quadraticCurveTo(-9,-47,-2,-38);ctx.moveTo(3,-38);ctx.quadraticCurveTo(13,-47,20,-38);ctx.stroke();ctx.strokeStyle='#4b241a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-12,-4);ctx.quadraticCurveTo(0,5,12,-4);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('Chingles',0,22);ctx.restore()}
function drawMouth(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#f39a8a';ctx.beginPath();ctx.ellipse(0,0,62,49+mouth.open*12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b142d';ctx.beginPath();ctx.ellipse(0,5,48,34+mouth.open*12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fffaf1';ctx.beginPath();ctx.roundRect(-39,-24,78,15,6);ctx.fill();ctx.beginPath();ctx.roundRect(-28,27,56,9,5);ctx.fill();ctx.fillStyle='#f05a79';ctx.beginPath();ctx.ellipse(0,26,18,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#54233b';ctx.beginPath();ctx.arc(-21,-38,5,0,Math.PI*2);ctx.arc(21,-38,5,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawCannon(){let x=W*.18,y=H*.79;ctx.save();ctx.translate(x,y);let a=Math.atan2((aim.y-y),(aim.x-x));a=Math.max(-1.3,Math.min(-.15,a));ctx.rotate(a);ctx.fillStyle='#a92d32';ctx.beginPath();ctx.roundRect(-6,-22,66,44,13);ctx.fill();ctx.fillStyle='#ffbd42';ctx.beginPath();ctx.roundRect(35,-25,25,50,8);ctx.fill();ctx.fillStyle='#572b39';ctx.beginPath();ctx.arc(57,0,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f8d15a';ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.restore();drawTube(x-38,y+8,.72)}
function draw(){ctx.clearRect(0,0,W,H); // carnival background
ctx.globalAlpha=.23;for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#fff':'#ffd75c';ctx.beginPath();ctx.arc((i*113+frame*.2)%W,35+(i%3)*23,3+(i%3),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
// bunting
for(let i=0;i<10;i++){let x=i*W/9;ctx.strokeStyle='#fff4b5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W/18,35);ctx.stroke();ctx.fillStyle=['#ff5353','#ffd947','#64df91','#bc82ff'][i%4];ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W/18,30);ctx.lineTo(x+W/9,0);ctx.fill()}
// floor
ctx.fillStyle='#b97842';ctx.fillRect(0,H*.73,W,H*.27);for(let y=H*.75;y<H;y+=28){ctx.strokeStyle='#e8b66d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=0;x<W;x+=80){ctx.strokeStyle='#a6663b';ctx.beginPath();ctx.moveTo(x,H*.73);ctx.lineTo(x-20,H);ctx.stroke()}
// mouth floats
let bob=Math.sin(frame*.07)*5;drawMouth(mouth.x,mouth.y+bob,Math.min(1.05,W/600));ctx.fillStyle='#fff';ctx.globalAlpha=.8;ctx.beginPath();ctx.ellipse(mouth.x-35,mouth.y-54,8,12,-.4,0,Math.PI*2);ctx.ellipse(mouth.x+35,mouth.y-54,8,12,.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// aim trajectory
if(playing&&!drag&&shots.length===0){ctx.setLineDash([4,8]);ctx.strokeStyle='#fff9b0aa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.18,H*.79);ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([])}
drawCannon();for(const s of shots){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle='#ffd66c';ctx.strokeStyle='#c98525';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,12,7,.2,0,Math.PI*2);ctx.fill();ctx.stroke();for(let k=0;k<3;k++){ctx.strokeStyle='#f8b84e';ctx.beginPath();ctx.arc(-2+k*4,0,3,-1,1);ctx.stroke()}ctx.restore()}
for(const b of bits){ctx.fillStyle=b.color;ctx.globalAlpha=Math.max(0,b.life/30);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}if(messageT>0){text(message,W*.5,H*.53,Math.min(44,W*.09),message.includes('CRUNCH')?'#ffe65b':'#ff7d87','#a02b35',4)}if(!playing&&overlay.classList.contains('hide')===false){/* title overlay handles */}}
function getPoint(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function aimAt(p){aim={x:Math.max(W*.28,Math.min(W*.96,p.x)),y:Math.max(H*.12,Math.min(H*.72,p.y))};}
c.addEventListener('pointerdown',e=>{if(!playing)return;drag=true;pointer=getPoint(e);aimAt(pointer);c.setPointerCapture(e.pointerId);hint.textContent='🎯 LINE IT UP… RELEASE TO FIRE!';draw()});c.addEventListener('pointermove',e=>{if(!playing||!drag)return;pointer=getPoint(e);aimAt(pointer);draw()});c.addEventListener('pointerup',e=>{if(!playing||!drag)return;drag=false;pointer=getPoint(e);aimAt(pointer);fire();hint.textContent='☝️ DRAG TO AIM · RELEASE TO FIRE'});c.addEventListener('pointercancel',()=>drag=false);
function fire(){let sx=W*.18,sy=H*.79,dx=aim.x-sx,dy=aim.y-sy;let len=Math.hypot(dx,dy)||1;let speed=Math.min(13,Math.max(8,W*.018));shots.push({x:sx+Math.cos(Math.atan2(dy,dx))*52,y:sy+Math.sin(Math.atan2(dy,dx))*52,vx:dx/len*speed,vy:dy/len*speed,rot:0,life:130});shotsLeft++;}
function burst(x,y,color='#ffe65b'){for(let i=0;i<14;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*4;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*4,life:25+Math.random()*15,color})}}
function update(){frame++;mouth.x+=mouth.dir*(1.1+Math.min(score/1800,2));if(mouth.x>W*.89)mouth.dir=-1;if(mouth.x<W*.57)mouth.dir=1;mouth.open=Math.max(0,mouth.open-.025);
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.015;s.rot+=.14;s.life--;let hit=Math.hypot(s.x-mouth.x,s.y-mouth.y)<53*Math.min(1.05,W/600);if(hit){score+=100;mouth.open=1;message='CRUNCH! +100';messageT=45;burst(s.x,s.y);shots.splice(i,1);document.getElementById('score').textContent=score;if(score>best){best=score;localStorage.setItem('chinglesBest',best);document.getElementById('best').textContent=best}continue}if(s.life<=0||s.x>W+30||s.y>H+30||s.x<-30){shots.splice(i,1);message='OH, CRUMBS!';messageT=38;}}
for(let i=bits.length-1;i>=0;i--){let b=bits[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.08;b.life--;if(b.life<=0)bits.splice(i,1)}if(messageT>0)messageT--;draw();requestAnimationFrame(update)}
document.getElementById('play').onclick=()=>{score=0;shots=[];bits=[];shotsLeft=0;playing=true;document.getElementById('score').textContent=0;overlay.classList.add('hide');hint.classList.remove('hide');hint.textContent='☝️ DRAG TO AIM · RELEASE TO FIRE'};document.getElementById('how').onclick=()=>{overlay.querySelector('h2').textContent='HOW TO PLAY';overlay.querySelector('p').innerHTML='1. Touch and drag to aim the cannon.<br>2. Lift your finger to fire a crisp.<br>3. Hit the moving mouth for 100 points!';document.getElementById('play').textContent='▶ LET’S CRUNCH';document.getElementById('how').classList.add('hide')};resize();requestAnimationFrame(update);
})();
</script></body></html>
