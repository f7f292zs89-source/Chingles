<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#28164f"><title>CHINGLES 3: Boss Mouth Battle</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#21143f;color:#fff}#app{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:auto;background:linear-gradient(#35226d,#221d4b 60%,#9a326a)}header{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:8px 10px;background:#1b1438;border-bottom:2px solid #ffdf70}.brand h1{margin:0;font-size:clamp(20px,4.8vw,36px);color:#ffec68;line-height:1;text-shadow:2px 3px #e8416b}.brand small{font-weight:1000;letter-spacing:1px;font-size:clamp(8px,1.8vw,11px)}.stats{display:flex;gap:4px}.stat{min-width:48px;text-align:center;padding:4px;border:2px solid #ffdf70;border-radius:8px;background:#34245f}.stat span{display:block;font-size:8px;font-weight:900;color:#ffdf70}.stat b{font-size:15px}#arena{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1d173bea;border:2px solid #ffdf70;border-radius:18px;padding:7px 10px;font-size:clamp(10px,2.4vw,13px);font-weight:1000;pointer-events:none}#toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);font-size:clamp(22px,6vw,40px);font-weight:1000;color:#fff36b;-webkit-text-stroke:1px #8d245e;text-shadow:3px 4px #231347;white-space:nowrap;pointer-events:none;text-align:center}.hide{display:none!important}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:13px;background:#120b2ac9}.panel{width:min(430px,100%);max-height:94%;overflow:auto;text-align:center;padding:17px 15px;border:4px solid #fff;border-radius:24px;background:linear-gradient(145deg,#fff5bd,#ffb65c);color:#28204c;box-shadow:0 8px #9e2e69}.panel h2{margin:0;color:#e93e65;font-size:clamp(30px,8vw,49px);line-height:1;text-shadow:2px 3px white}.hero{font-size:clamp(44px,12vw,65px);margin:8px}.panel p{font-weight:850;line-height:1.4;margin:9px 0 13px}button{font:inherit;font-weight:1000;border:0;border-radius:14px;padding:12px 17px;cursor:pointer}.primary{width:100%;background:linear-gradient(#46df7d,#12a44e);color:white;font-size:20px;box-shadow:0 5px #087638}.small{font-size:12px;color:#6d5685;font-weight:850}</style></head><body><div id="app"><header><div class="brand"><h1>CHINGLES 3!</h1><small>BOSS MOUTH BATTLE</small></div><div class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>LEVEL</span><b id="level">1</b></div><div class="stat"><span>BOSS HP</span><b id="hp">5</b></div></div></header><main id="arena"><canvas id="game"></canvas><div id="toast"></div><div id="hint">☝️ DRAG TO AIM · RELEASE TO FIRE</div><div id="overlay"><div class="panel"><h2 id="title">CHINGLES 3!</h2><div class="hero" id="hero">🍿👹🦷</div><p id="message">The Boss Mouth has arrived! Land 5 hits to beat each level. Defeat all five bosses to become the Crisp Champion!</p><button class="primary" id="start">BATTLE THE MOUTH!</button><p class="small">🎮 Made for Avani · Aim, fire, CRUNCH!</p></div></div></main></div><script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),arena=document.getElementById('arena'),$=id=>document.getElementById(id);let W=600,H=500,dpr=1,playing=false,frame=0,score=0,level=1,hp=5,shots=[],parts=[],aim={x:400,y:120},drag=false,toastT=0,shake=0;const boss={x:0,y:0,dir:1,open:0,flash:0};function resize(){let r=arena.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);boss.y=H*.28;boss.x=boss.x||W*.72;aim={x:W*.72,y:H*.28};draw()}addEventListener('resize',resize);function txt(t,x,y,size,fill='#fff',stroke='#33205e'){ctx.font=`1000 ${size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=stroke;ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y)}function say(s){$('toast').textContent=s;toastT=65}function burst(x,y){for(let i=0;i<24;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:25+Math.random()*25,color:['#ffed68','#ff6e9b','#7cf3ff','#fff'][i%4],size:2+Math.random()*5})}}function mouth(){ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(Math.sin(frame*.04)*.045);let sc=Math.min(1.08,W/500);ctx.scale(sc,sc);ctx.fillStyle=boss.flash>0?'#fff6a0':'#ff9b9d';ctx.beginPath();ctx.ellipse(0,0,76,57+boss.open*15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#51122f';ctx.beginPath();ctx.ellipse(0,6,60,41+boss.open*15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9e8';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*21-9,-31);ctx.lineTo(i*21+9,-31);ctx.lineTo(i*21+5,-9);ctx.quadraticCurveTo(i*21,0,i*21-5,-9);ctx.closePath();ctx.fill()}ctx.fillStyle='#ff477b';ctx.beginPath();ctx.ellipse(0,34,23,10,0,0,Math.PI*2);ctx.fill();ctx.restore();if(boss.flash>0)boss.flash--}function cannon(){let x=W*.16,y=H*.82;ctx.save();ctx.translate(x,y);let a=Math.atan2(aim.y-y,aim.x-x);a=Math.max(-1.4,Math.min(-.14,a));ctx.rotate(a);ctx.fillStyle='#ef4564';ctx.beginPath();ctx.roundRect(-7,-19,67,38,11);ctx.fill();ctx.fillStyle='#ffcf51';ctx.beginPath();ctx.roundRect(30,-24,30,48,8);ctx.fill();ctx.restore();txt('🥔',x-20,y+15,23)}function crisp(s){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle=s.big?'#ffb22e':'#ffdf55';ctx.strokeStyle='#a95d32';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s.r,-s.r*.35);ctx.quadraticCurveTo(-s.r*1.1,-s.r,0,-s.r*.6);ctx.quadraticCurveTo(s.r*1.1,-s.r,s.r,-s.r*.35);ctx.quadraticCurveTo(s.r*1.1,s.r*.3,0,s.r*.65);ctx.quadraticCurveTo(-s.r*1.1,s.r*.3,-s.r,-s.r*.35);ctx.fill();ctx.stroke();if(s.big)txt('⭐',0,0,18,'#fff','#d05c38');ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#52388b');g.addColorStop(.55,'#262052');g.addColorStop(1,'#9c2d6a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<24;i++){let x=(i*97+frame*.22)%W,y=(i*61)%H;ctx.fillStyle=i%2?'#ffdf70':'#ff6e9b';ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;txt('LEVEL '+level,W/2,H*.09,18,'#ffef72','#36205e');mouth();cannon();shots.forEach(crisp);parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/45);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1});ctx.restore()}function nextLevel(){if(level>=5){playing=false;$('title').textContent='AVANI WINS!';$('hero').textContent='🏆👑🍿';$('message').textContent=`INCREDIBLE! You defeated all five boss levels and scored ${score} points. You are the Crisp Champion!`;$('start').textContent='PLAY AGAIN!';$('overlay').classList.remove('hide');say('CRISP CHAMPION!');return}level++;hp=5+level;$('level').textContent=level;$('hp').textContent=hp;say('LEVEL UP! BOSS GETS TOUGHER!')}function update(){frame++;boss.x+=boss.dir*(1.05+level*.18);if(boss.x>W*.88)boss.dir=-1;if(boss.x<W*.57)boss.dir=1;boss.open=Math.max(0,boss.open-.04);if(shake>0)shake*=.8;for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.035;s.rot+=.17;s.life--;if(Math.hypot(s.x-boss.x,s.y-boss.y)<(s.big?78:58)*Math.min(1.1,W/500)){hp--;score+=100+level*25;boss.open=1;boss.flash=5;shake=7;burst(s.x,s.y);say(hp<=0?'BOSS CRUNCHED! 🎉':`DIRECT HIT! +${100+level*25}`);shots.splice(i,1);$('score').textContent=score;$('hp').textContent=Math.max(0,hp);if(hp<=0){nextLevel();if(!playing)return;}$('level').textContent=level;continue}if(s.life<=0||s.x>W+40||s.y>H+50||s.x<-40)shots.splice(i,1)}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--;if(p.life<=0)parts.splice(i,1)}if(toastT>0)toastT--}function point(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function aimAt(p){aim={x:Math.max(W*.27,Math.min(W*.96,p.x)),y:Math.max(H*.08,Math.min(H*.72,p.y))}}function fire(){let sx=W*.16,sy=H*.82,dx=aim.x-sx,dy=aim.y-sy,t=Math.max(15,Math.min(38,dx/Math.max(4,W*.027))),g=.035,vx=dx/t,vy=(dy-.5*g*t*t)/t;shots.push({x:sx+vx*5,y:sy+vy*5,vx,vy:vy+g*5,rot:0,life:150,r:10,big:false})}c.addEventListener('pointerdown',e=>{if(!playing)return;drag=true;aimAt(point(e));try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(playing&&drag){aimAt(point(e));draw()}});c.addEventListener('pointerup',e=>{if(!playing||!drag)return;drag=false;aimAt(point(e));fire()});c.addEventListener('pointercancel',()=>drag=false);$('start').addEventListener('click',()=>{playing=true;frame=0;score=0;level=1;hp=5;shots=[];parts=[];boss.x=W*.72;boss.dir=1;$('score').textContent='0';$('level').textContent='1';$('hp').textContent='5';$('title').textContent='CHINGLES 3!';$('hero').textContent='🍿👹🦷';$('message').textContent='Land 5 hits on each boss. Beat all 5 levels to become the Crisp Champion!';$('start').textContent='BATTLE THE MOUTH!';$('overlay').classList.add('hide');say('BOSS BATTLE!')});function loop(){if(playing)update();draw();$('toast').style.opacity=toastT>0?Math.min(1,toastT/12):0;requestAnimationFrame(loop)}resize();loop()})();
</script></body></html>
