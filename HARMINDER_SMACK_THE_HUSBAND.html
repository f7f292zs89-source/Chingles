<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ff4e9b"><title>Harminder's Smack the Husband!</title><style>
:root{--p:#ff4e9b;--u:#40204f;--y:#ffe66d;--b:#41c9f4;--o:#ff9f35}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:10px;background:linear-gradient(145deg,#b9f3ff,#ffe1f1 55%,#fff0a1);font-family:system-ui,sans-serif;color:var(--u);display:flex;justify-content:center}main{width:min(100%,520px);align-self:flex-start;background:#fffdf1;border:4px solid white;border-radius:26px;padding:14px;box-shadow:0 7px 0 #6b3c7a;text-align:center}h1{font-size:clamp(2rem,9vw,3.2rem);line-height:.92;margin:4px 0;color:var(--p);text-shadow:3px 4px 0 var(--u);transform:rotate(-1deg)}.tag{font-weight:900;font-size:.86rem;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:6px;margin:10px 0;flex-wrap:wrap}.pill{background:var(--u);color:white;padding:7px 10px;border-radius:13px;font-weight:950;font-size:.9rem}#arena{height:clamp(220px,34vh,320px);position:relative;overflow:hidden;border:4px solid white;border-radius:20px;background:linear-gradient(#7ce8fb 0 54%,#ffe88b 54% 72%,#ff82ba 72%);box-shadow:0 5px 0 #6b3c7a;touch-action:manipulation}#husband{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);font-size:clamp(5rem,23vw,7rem);cursor:pointer;user-select:none;touch-action:manipulation;filter:drop-shadow(0 5px white);transition:left .14s,top .14s}#husband.hit{animation:wobble .32s ease}@keyframes wobble{25%{transform:translate(-50%,-50%) rotate(-18deg) scale(1.15)}55%{transform:translate(-50%,-50%) rotate(20deg) scale(.9)}}#effect{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,8vw,3rem);font-weight:1000;color:#ff2482;text-shadow:2px 3px white;pointer-events:none;opacity:0}#effect.pop{animation:pop .5s ease}@keyframes pop{20%,75%{opacity:1;transform:scale(1.15) rotate(5deg)}100%{opacity:0;transform:scale(1.4)}}#message{min-height:46px;margin:12px 0 5px;font-size:1rem;font-weight:1000;display:flex;align-items:center;justify-content:center}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:3px solid white;border-radius:16px;padding:12px 6px;min-height:50px;color:white;font-size:clamp(.85rem,4vw,1.03rem);font-weight:1000;box-shadow:0 4px 0 #6b3c7a;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active{transform:translateY(3px);box-shadow:0 1px #6b3c7a}#start{grid-column:1/-1;background:#31bb73}#pie{background:var(--p)}#bonk{background:var(--o)}#tomato{background:var(--b)}#dodge{background:#8654e8}#again{grid-column:1/-1;background:var(--u)}#result{display:none;margin-top:10px;padding:10px;border-radius:15px;background:#fff0a6;font-weight:900}.note{font-size:.72rem;opacity:.75;margin:12px 0 0}@media(max-width:380px){body{padding:6px}main{padding:10px}.tag{font-size:.78rem}.pill{font-size:.8rem;padding:6px 8px}#arena{height:29vh;min-height:205px}button{min-height:47px;padding:10px 4px}}
</style></head><body><main><h1>SMACK THE<br>HUSBAND! 😂</h1><div class="tag">HARMINDER'S OFFICIAL STRESS RELIEF SIMULATOR</div><div class="stats"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">TIME <span id="time">20</span>s</div><div class="pill">BEST <span id="best">0</span></div></div><div id="arena"><div style="position:absolute;left:8%;top:8%;font-size:2rem">☁️</div><div style="position:absolute;right:8%;top:15%;font-size:2rem">☁️</div><div id="husband" role="button" aria-label="Cartoon husband">🤵🏻</div><div id="effect">PIE FACE!</div></div><div id="message">Tap START, then give that husband a cream pie. 🥧</div><div class="buttons"><button id="start">▶ START THE NONSENSE</button><button id="pie">🥧 PIE FACE!</button><button id="bonk">🪠 BONK!</button><button id="tomato">🍅 TOMATO TOSS</button><button id="dodge">💨 MAKE HIM DODGE</button><button id="again">🔁 REMATCH, HARMINDER!</button></div><div id="result"></div><p class="note">20 seconds of cartoon chaos. No husbands were harmed. Probably. Personal best saves on this device.</p></main><script>
(()=>{const $=id=>document.getElementById(id),arena=$('arena'),h=$('husband'),fx=$('effect');let score=0,time=20,running=false,timer=null,mover=null,best=0;try{best=+(localStorage.getItem('harminderSmackBest')||0)}catch(e){}$('best').textContent=best;const lines={pie:['PIE IN YOUR EYE! 🥧','CUSTARD CHAOS!','CREAMED! ABSOLUTELY CREAMED!','OH NO, HIS HAIR!','FLAN-TASTIC HIT!'],bonk:['BONK! 🪠','STRAIGHT TO SILLY JAIL!','THE PLOP HEARD ROUND THE WORLD!','HEAD EMPTY. BONK LOUD.'],tomato:['TOMATO-ED! 🍅','KETCHUP ON AISLE THREE!','HEIRLOOM HUMILIATION!','SPLAT! FIVE-STAR TOMATO!'],dodge:['NINJA HUSBAND! 💨','HE MOVED LIKE A WET NOODLE!','YOU MISSED, HARMINDER!']};function say(s){$('message').textContent=s}function update(){$('score').textContent=score;$('time').textContent=time}function move(){let r=arena.getBoundingClientRect(),w=h.offsetWidth,hh=h.offsetHeight,x=25+Math.random()*Math.max(1,r.width-w-50),y=20+Math.random()*Math.max(1,r.height-hh-40);h.style.left=(x+w/2)+'px';h.style.top=(y+hh/2)+'px'}function start(){clearInterval(timer);clearInterval(mover);score=0;time=20;running=true;$('result').style.display='none';$('start').textContent='🔄 RESTART';h.textContent='🤵🏻';update();say('GET HIM, HARMINDER! THE CUSTARD IS READY! 🥧');timer=setInterval(()=>{time--;update();if(time<=0)finish()},1000);mover=setInterval(()=>{if(running&&Math.random()<.65)move()},950)}function finish(){running=false;clearInterval(timer);clearInterval(mover);$('start').textContent='▶ PLAY AGAIN';if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('harminderSmackBest',best)}catch(e){}}$('result').style.display='block';$('result').textContent=score>=30?`🏆 HARMINDER WINS! ${score} points. LEGENDARY BONKING.`:`Final score: ${score}. The husband is demanding a rematch. CHEEKY SOD.`;say(score>=30?'ALL HAIL HARMINDER, QUEEN OF CHAOS! 👑':'UNFINISHED BUSINESS. HAVE ANOTHER GO!')}function hit(kind){if(!running){say('Press START first, boss lady! 👑');return}if(Math.random()<.84){let pts=kind==='bonk'?3:kind==='dodge'?1:2;score+=pts;h.textContent=kind==='pie'?'🤡':kind==='bonk'?'🥴':kind==='tomato'?'😵':'😱';say(lines[kind][Math.floor(Math.random()*lines[kind].length)]+' +'+pts);fx.textContent=kind==='pie'?'PIE FACE! 🥧':kind==='bonk'?'BONK! 🪠':kind==='tomato'?'SPLAT! 🍅':'WHOOSH! 💨';fx.classList.remove('pop');void fx.offsetWidth;fx.classList.add('pop');move()}else{score=Math.max(0,score-1);say('MISS! YOU HIT THE SOFA INSTEAD. -1');h.textContent='😏';move()}update();h.classList.remove('hit');void h.offsetWidth;h.classList.add('hit')}$('start').addEventListener('click',start);$('again').addEventListener('click',start);$('pie').addEventListener('click',()=>hit('pie'));$('bonk').addEventListener('click',()=>hit('bonk'));$('tomato').addEventListener('click',()=>hit('tomato'));$('dodge').addEventListener('click',()=>hit('dodge'));h.addEventListener('click',()=>hit('pie'));update()})();
</script></body></html>
